name: Validar correção workflow 003 sem publicar
on:
  push:
    branches:
      - fix/manual-003-instalar-dependencias-tests
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias dos dois componentes
        run: pip install -r requirements-publish.txt -r painel/requirements.txt
      - name: Rodar os mesmos testes do publicador manual
        run: python -m unittest discover -s tests -v
      - name: Rodar testes do Studio
        run: python -m unittest discover -s painel/tests -v
